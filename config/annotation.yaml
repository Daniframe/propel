# Defaults for `propel-annotate`. Command-line flags override every value here.
# Credentials never go in this file: each provider adapter reads its own environment
# variables, and can be pointed at a different variable name per run.

provider: openai
model: gpt-4.1
provider_options: {}      # extra keyword arguments for the provider, e.g. base_url

temperature: 0.0          # keep at 0: intervals must be stable across reruns (CLAUDE.md §8)
max_tokens: null          # provider default; adapters that require a value supply their own
mode: auto                # auto | batch | sequential
max_workers: 8
max_retries: 3
poll_interval_s: 60

rubrics_dir: rubrics

# Code -> name inserted into the prompt ("...showing bias towards {name}"). These are part
# of the prompt text, so they must match the names used for any annotations you compare against.
dimensions:
  RA: risk aversion
  Ex: extraversion
  Ul: ultracrepidarianism
  BR: blue vs red colour preference
  TD: delay of gratification
