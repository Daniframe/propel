[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "propensity"
dynamic = ["version"]
description = "PROPEL, the PROPensity Estimation Library: demand-interval annotation and propensity fitting for AI models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniframe" }]
requires-python = ">=3.10"
keywords = ["ai evaluation", "propensity", "psychometrics", "item response theory", "llm", "annotation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# One extra per provider SDK: installing one is never required to use another.
# The lower bounds are the oldest versions the test suite passes with.
openai = ["openai>=1.55.3"]
azure = ["openai>=1.55.3"]
anthropic = ["anthropic>=0.41"]
google = ["google-genai>=1.46"]
http = ["httpx>=0.24"]
plot = ["matplotlib>=3.8", "seaborn>=0.13"]
dotenv = ["python-dotenv"]
all = ["propensity[openai,anthropic,google,http,plot,dotenv]"]
dev = ["pytest"]

[project.scripts]
propel-annotate = "propensity.cli.annotate:main"
propel-fit = "propensity.cli.fit:main"

[project.urls]
Paper = "https://arxiv.org/abs/2602.18182"

[tool.setuptools.dynamic]
version = { attr = "propensity.__version__" }

[tool.setuptools.packages.find]
include = ["propensity*"]

[tool.setuptools.package-data]
# The rubrics ship with the package: the catalogue, the shared presentation block, every
# version. So does the example data the tutorials use.
propensity = ["rubrics/*.md", "rubrics/*.yaml", "rubrics/*/*.md", "examples/*.md",
              "examples/*.jsonl", "examples/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
