name: release

# Pushing a tag vX.Y.Z builds that version, tests the built files on three systems, and
# publishes them to TestPyPI. Publishing to PyPI is never automatic: run this workflow by hand,
# on the tag, with index "pypi". Both use trusted publishing (no tokens); see dev/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      index:
        description: "Where to publish the build"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: The tag names the package's version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('propensity/__init__.py', encoding='utf-8').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match propensity.__version__ $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  check:
    name: check · ${{ matrix.os }} · Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]  # the oldest and the newest supported
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install and test the built wheel
        shell: bash
        run: bash .github/scripts/check-dist.sh dist "all,dev"

  testpypi:
    needs: check
    if: github.event_name == 'push' || inputs.index == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/propensity
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: check
    # Only by hand, and only from a tag: a PyPI release is permanent.
    if: github.event_name == 'workflow_dispatch' && inputs.index == 'pypi' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/propensity
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
